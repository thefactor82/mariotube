name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build executable
        run: pyinstaller --clean --noconfirm mariotube.spec

      - name: Create zip archive
        shell: pwsh
        run: Compress-Archive -Path dist\mariotube.exe -DestinationPath dist\mariotube.zip -Force

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Mariotube ${{ github.ref_name }}
          files: |
            dist/mariotube.exe
            dist/mariotube.zip
          generate_release_notes: true